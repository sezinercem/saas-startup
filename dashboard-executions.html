<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Executions — NexaFlow Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/dashboard.css" />
  <link rel="stylesheet" href="styles/dashboard-inner.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <style>
    .exec-log-panel {
      position: fixed; right: 0; top: 0; bottom: 0; width: 420px;
      background: #0a0a0f; border-left: 1px solid rgba(0,245,255,0.15);
      transform: translateX(100%); transition: transform .3s ease;
      z-index: 200; display: flex; flex-direction: column; overflow: hidden;
    }
    .exec-log-panel.open { transform: translateX(0); }
    .exec-log-header {
      padding: 20px 24px; border-bottom: 1px solid rgba(0,245,255,0.1);
      display: flex; align-items: flex-start; gap: 12px;
    }
    .exec-log-header h3 { font-size: 14px; font-weight: 600; color: #e8f4f8; margin: 0 0 4px; }
    .exec-log-header p { font-size: 12px; color: rgba(232,244,248,0.5); margin: 0; font-family: 'JetBrains Mono', monospace; }
    .exec-log-close {
      margin-left: auto; background: none; border: none; color: rgba(232,244,248,0.4);
      cursor: pointer; font-size: 18px; line-height: 1; padding: 4px;
      transition: color .2s; flex-shrink: 0;
    }
    .exec-log-close:hover { color: #e8f4f8; }
    .exec-log-meta {
      padding: 16px 24px; border-bottom: 1px solid rgba(0,245,255,0.08);
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .exec-meta-item { display: flex; flex-direction: column; gap: 4px; }
    .exec-meta-label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: rgba(232,244,248,0.4); }
    .exec-meta-value { font-size: 13px; color: #e8f4f8; font-family: 'JetBrains Mono', monospace; }
    .exec-log-steps {
      padding: 16px 24px; border-bottom: 1px solid rgba(0,245,255,0.08);
    }
    .exec-log-steps h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: rgba(232,244,248,0.5); margin: 0 0 12px; }
    .step-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .step-item:last-child { border-bottom: none; }
    .step-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .step-dot.success { background: #00ff88; box-shadow: 0 0 6px #00ff88; }
    .step-dot.failed { background: #ff4d6d; box-shadow: 0 0 6px #ff4d6d; }
    .step-dot.running { background: #00f5ff; box-shadow: 0 0 6px #00f5ff; animation: pulse 1s infinite; }
    .step-dot.pending { background: rgba(232,244,248,0.2); }
    .step-name { font-size: 12px; color: #e8f4f8; flex: 1; }
    .step-dur { font-size: 11px; color: rgba(232,244,248,0.4); font-family: 'JetBrains Mono', monospace; }
    .exec-log-output {
      flex: 1; overflow-y: auto; padding: 16px 24px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
    }
    .exec-log-output h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: rgba(232,244,248,0.5); margin: 0 0 12px; }
    .log-line { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .log-line .ts { color: rgba(232,244,248,0.3); margin-right: 8px; }
    .log-line.info .msg { color: rgba(232,244,248,0.7); }
    .log-line.success .msg { color: #00ff88; }
    .log-line.error .msg { color: #ff4d6d; }
    .log-line.warn .msg { color: #ffd700; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .live-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(0,255,136,0.1); border: 1px solid rgba(0,255,136,0.3);
      color: #00ff88; font-size: 11px; padding: 3px 10px; border-radius: 20px;
    }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #00ff88; animation: pulse 1s infinite; }
    .cancel-btn {
      background: rgba(255,77,109,0.1); border: 1px solid rgba(255,77,109,0.3);
      color: #ff4d6d; padding: 4px 10px; border-radius: 6px; font-size: 11px;
      cursor: pointer; transition: all .2s;
    }
    .cancel-btn:hover { background: rgba(255,77,109,0.2); }
    .retry-btn {
      background: rgba(0,245,255,0.1); border: 1px solid rgba(0,245,255,0.3);
      color: #00f5ff; padding: 4px 10px; border-radius: 6px; font-size: 11px;
      cursor: pointer; transition: all .2s;
    }
    .retry-btn:hover { background: rgba(0,245,255,0.2); }
  </style>
</head>
<body>
<div class="dash-layout">
  <!-- sidebar injected by shell.js -->
  <main class="dash-main">
    <div class="dash-topbar">
      <div>
        <h1 class="dash-page-title">Executions</h1>
        <p class="dash-page-sub">Full run history for all workflows</p>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="live-badge"><span class="live-dot"></span>Live</span>
        <span id="running-count" style="font-size:12px;color:rgba(232,244,248,0.5)">Loading…</span>
      </div>
    </div>

    <!-- Stats Row -->
    <div class="dash-stats-row" id="stats-row">
      <div class="dash-stat-card"><div class="dsc-label">Total Runs</div><div class="dsc-value" id="s-total">—</div></div>
      <div class="dash-stat-card"><div class="dsc-label">Successful</div><div class="dsc-value" style="color:#00ff88" id="s-success">—</div></div>
      <div class="dash-stat-card"><div class="dsc-label">Failed</div><div class="dsc-value" style="color:#ff4d6d" id="s-failed">—</div></div>
      <div class="dash-stat-card"><div class="dsc-label">Avg Duration</div><div class="dsc-value" id="s-avg">—</div></div>
    </div>

    <!-- Filter Bar -->
    <div class="dash-filter-bar" style="margin-top:24px">
      <input id="q" class="dash-filter-input" placeholder="Search executions…" oninput="filt()" />
      <select id="f-status" class="dash-filter-select" onchange="filt()">
        <option value="">All Statuses</option>
        <option value="running">Running</option>
        <option value="success">Success</option>
        <option value="failed">Failed</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <select id="f-trigger" class="dash-filter-select" onchange="filt()">
        <option value="">All Triggers</option>
        <option value="manual">Manual</option>
        <option value="webhook">Webhook</option>
        <option value="schedule">Schedule</option>
        <option value="api">API</option>
      </select>
      <select id="f-sort" class="dash-filter-select" onchange="filt()">
        <option value="started_at">Newest First</option>
        <option value="duration_ms">By Duration</option>
        <option value="workflow_name">By Workflow</option>
      </select>
    </div>

    <!-- Table -->
    <div class="dash-table-wrap" style="margin-top:16px">
      <table class="dash-table">
        <thead>
          <tr>
            <th>Execution ID</th>
            <th>Workflow</th>
            <th>Status</th>
            <th>Trigger</th>
            <th>Started</th>
            <th>Duration</th>
            <th>Steps</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="exec-tbody">
          <tr><td colspan="8" style="text-align:center;padding:40px;color:rgba(232,244,248,0.3)">Loading executions…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="dash-pagination" id="pager"></div>
  </main>
</div>

<!-- Execution Log Panel -->
<div class="exec-log-panel" id="log-panel">
  <div class="exec-log-header">
    <div>
      <h3 id="lp-name">Execution Details</h3>
      <p id="lp-id">—</p>
    </div>
    <span id="lp-status-badge"></span>
    <button class="exec-log-close" onclick="closePanel()">✕</button>
  </div>
  <div class="exec-log-meta">
    <div class="exec-meta-item"><span class="exec-meta-label">Workflow</span><span class="exec-meta-value" id="lp-workflow">—</span></div>
    <div class="exec-meta-item"><span class="exec-meta-label">Trigger</span><span class="exec-meta-value" id="lp-trigger">—</span></div>
    <div class="exec-meta-item"><span class="exec-meta-label">Started</span><span class="exec-meta-value" id="lp-started">—</span></div>
    <div class="exec-meta-item"><span class="exec-meta-label">Duration</span><span class="exec-meta-value" id="lp-duration">—</span></div>
  </div>
  <div class="exec-log-steps">
    <h4>Steps</h4>
    <div id="lp-steps">—</div>
  </div>
  <div class="exec-log-output">
    <h4>Log Output</h4>
    <div id="lp-logs">—</div>
  </div>
</div>

<script src="js/shell.js"></script>
<script>
const PG = 20;
let all = [], filtered = [], pg = 1, sub;

async function load() {
  const s = window.__currentUser;
  if (!s) return;
  const uid = s.id;

  const { data, error } = await window.sb
    .from('executions')
    .select('*')
    .eq('user_id', uid)
    .order('started_at', { ascending: false })
    .limit(500);

  if (error) { console.error(error); return; }
  all = data || [];
  stats();
  filt();
  subscribeRealtime(uid);
}

function stats() {
  const total = all.length;
  const succ = all.filter(e => e.status === 'success').length;
  const fail = all.filter(e => e.status === 'failed').length;
  const durs = all.filter(e => e.duration_ms).map(e => e.duration_ms);
  const avg = durs.length ? Math.round(durs.reduce((a,b)=>a+b,0)/durs.length) : 0;
  const running = all.filter(e => e.status === 'running').length;

  document.getElementById('s-total').textContent = total.toLocaleString();
  document.getElementById('s-success').textContent = succ.toLocaleString();
  document.getElementById('s-failed').textContent = fail.toLocaleString();
  document.getElementById('s-avg').textContent = avg ? window.fmtDuration(avg) : '—';
  document.getElementById('running-count').textContent = running > 0 ? `${running} running now` : 'All idle';
}

function filt() {
  const q = document.getElementById('q').value.toLowerCase();
  const fs = document.getElementById('f-status').value;
  const ft = document.getElementById('f-trigger').value;
  const sort = document.getElementById('f-sort').value;

  filtered = all.filter(e => {
    if (q && !e.workflow_name.toLowerCase().includes(q) && !e.id.includes(q)) return false;
    if (fs && e.status !== fs) return false;
    if (ft && e.trigger_type !== ft) return false;
    return true;
  });

  if (sort === 'duration_ms') filtered.sort((a,b) => (b.duration_ms||0) - (a.duration_ms||0));
  else if (sort === 'workflow_name') filtered.sort((a,b) => a.workflow_name.localeCompare(b.workflow_name));
  // default: already ordered by started_at desc

  pg = 1;
  tbl();
  pager();
}

function tbl() {
  const tbody = document.getElementById('exec-tbody');
  const slice = filtered.slice((pg-1)*PG, pg*PG);

  if (!slice.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:rgba(232,244,248,0.3)">No executions found</td></tr>';
    return;
  }

  tbody.innerHTML = slice.map(e => {
    const stMap = { success:'active', failed:'error', running:'running', cancelled:'inactive' };
    const stLabel = e.status.charAt(0).toUpperCase()+e.status.slice(1);
    const trMap = { manual:'manual', webhook:'webhook', schedule:'schedule', api:'api', email:'email', form:'form' };
    const shortId = e.id.split('-')[0];
    const steps = e.steps_completed != null ? `${e.steps_completed}/${e.steps_total||5}` : '—';
    const runningBtn = e.status === 'running'
      ? `<button class="cancel-btn" onclick="cancelExec('${e.id}')">Cancel</button>`
      : e.status === 'failed'
        ? `<button class="retry-btn" onclick="retryExec('${e.id}')">Retry</button>`
        : '';
    return `<tr style="cursor:pointer" onclick="openPanel('${e.id}')">
      <td><span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(0,245,255,0.8)">${shortId}</span></td>
      <td>${e.workflow_name}</td>
      <td><span class="badge ${stMap[e.status]||''}">${stLabel}</span></td>
      <td><span style="text-transform:capitalize;font-size:12px">${e.trigger_type||'manual'}</span></td>
      <td style="font-size:12px;color:rgba(232,244,248,0.6)">${window.fmtTime(e.started_at)}</td>
      <td style="font-family:'JetBrains Mono',monospace;font-size:12px">${e.duration_ms ? window.fmtDuration(e.duration_ms) : e.status==='running'?'<span style="color:#00f5ff">Running…</span>':'—'}</td>
      <td style="font-size:12px">${steps}</td>
      <td onclick="event.stopPropagation()">${runningBtn}</td>
    </tr>`;
  }).join('');
}

function pager() {
  const total = Math.ceil(filtered.length / PG);
  const el = document.getElementById('pager');
  if (total <= 1) { el.innerHTML = ''; return; }

  let html = `<button onclick="gp(${pg-1})" ${pg===1?'disabled':''}>← Prev</button>`;
  for (let i = 1; i <= total; i++) {
    if (i === 1 || i === total || Math.abs(i - pg) <= 2) {
      html += `<button class="${i===pg?'active':''}" onclick="gp(${i})">${i}</button>`;
    } else if (Math.abs(i - pg) === 3) {
      html += `<span style="padding:0 4px;color:rgba(232,244,248,0.3)">…</span>`;
    }
  }
  html += `<button onclick="gp(${pg+1})" ${pg===total?'disabled':''}>Next →</button>`;
  el.innerHTML = html;
}

function gp(n) {
  const total = Math.ceil(filtered.length / PG);
  if (n < 1 || n > total) return;
  pg = n; tbl(); pager();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function cancelExec(id) {
  await window.sb.from('executions').update({
    status: 'cancelled',
    completed_at: new Date().toISOString()
  }).eq('id', id);
  const idx = all.findIndex(e => e.id === id);
  if (idx >= 0) { all[idx].status = 'cancelled'; all[idx].completed_at = new Date().toISOString(); }
  stats(); filt();
  window.showToast('Execution cancelled', 'warning');
}

async function retryExec(id) {
  const orig = all.find(e => e.id === id);
  if (!orig) return;
  const uid = window.__currentUser.id;
  const { data: newExec } = await window.sb.from('executions').insert({
    workflow_id: orig.workflow_id,
    user_id: uid,
    workflow_name: orig.workflow_name,
    status: 'running',
    trigger_type: 'manual',
    started_at: new Date().toISOString(),
    steps_total: orig.steps_total || 5,
    steps_completed: 0
  }).select().single();

  if (newExec) {
    all.unshift(newExec);
    stats(); filt();
    window.showToast(`Retrying ${orig.workflow_name}`, 'info');
    simulateComplete(newExec.id);
  }
}

function simulateComplete(execId) {
  const delay = 2000 + Math.random() * 4000;
  setTimeout(async () => {
    const success = Math.random() > 0.2;
    const dur = Math.round(delay);
    await window.sb.from('executions').update({
      status: success ? 'success' : 'failed',
      completed_at: new Date().toISOString(),
      duration_ms: dur,
      steps_completed: success ? 5 : Math.floor(Math.random() * 4) + 1,
      error_message: success ? null : 'Step failed: timeout exceeded'
    }).eq('id', execId);
    const idx = all.findIndex(e => e.id === execId);
    if (idx >= 0) {
      all[idx].status = success ? 'success' : 'failed';
      all[idx].duration_ms = dur;
      all[idx].completed_at = new Date().toISOString();
    }
    stats(); filt();
  }, delay);
}

function openPanel(id) {
  const e = all.find(x => x.id === id);
  if (!e) return;

  document.getElementById('lp-name').textContent = e.workflow_name;
  document.getElementById('lp-id').textContent = e.id;
  const stMap = { success:'active', failed:'error', running:'running', cancelled:'inactive' };
  document.getElementById('lp-status-badge').innerHTML = `<span class="badge ${stMap[e.status]||''}">${e.status}</span>`;
  document.getElementById('lp-workflow').textContent = e.workflow_name;
  document.getElementById('lp-trigger').textContent = e.trigger_type || 'manual';
  document.getElementById('lp-started').textContent = e.started_at ? new Date(e.started_at).toLocaleString() : '—';
  document.getElementById('lp-duration').textContent = e.duration_ms ? window.fmtDuration(e.duration_ms) : e.status === 'running' ? 'Running…' : '—';

  // Steps
  const stepsTotal = e.steps_total || 5;
  const stepsComp = e.steps_completed || 0;
  const stepNames = ['Trigger received','Validate input','Process data','Transform output','Deliver result'];
  let stepsHtml = '';
  for (let i = 0; i < stepsTotal; i++) {
    let dotClass = 'pending';
    let dur = '—';
    if (i < stepsComp) { dotClass = 'success'; dur = Math.round(Math.random()*500+100)+'ms'; }
    else if (i === stepsComp && e.status === 'running') dotClass = 'running';
    else if (e.status === 'failed' && i === stepsComp) dotClass = 'failed';
    stepsHtml += `<div class="step-item"><span class="step-dot ${dotClass}"></span><span class="step-name">${stepNames[i]||'Step '+(i+1)}</span><span class="step-dur">${dur}</span></div>`;
  }
  document.getElementById('lp-steps').innerHTML = stepsHtml;

  // Logs
  const logs = e.log_output || [];
  let logsHtml = '';
  if (logs.length > 0) {
    logsHtml = logs.map(l => {
      const level = l.level || 'info';
      return `<div class="log-line ${level}"><span class="ts">${l.ts||''}</span><span class="msg">${l.msg||l}</span></div>`;
    }).join('');
  } else {
    const defaultLogs = [
      { ts: '00:00.000', level: 'info', msg: 'Execution started' },
      { ts: '00:00.120', level: 'info', msg: `Trigger: ${e.trigger_type || 'manual'}` },
      { ts: '00:00.340', level: 'info', msg: 'Loading workflow configuration' },
      { ts: '00:01.200', level: 'info', msg: 'Step 1 complete: Trigger received' },
    ];
    if (stepsComp >= 2) defaultLogs.push({ ts: '00:01.800', level: 'info', msg: 'Step 2 complete: Input validated' });
    if (stepsComp >= 3) defaultLogs.push({ ts: '00:02.500', level: 'info', msg: 'Step 3 complete: Data processed' });
    if (e.status === 'success') defaultLogs.push({ ts: '00:03.100', level: 'success', msg: '✓ Execution completed successfully' });
    if (e.status === 'failed') defaultLogs.push({ ts: '00:02.900', level: 'error', msg: `✗ ${e.error_message || 'Execution failed'}` });
    if (e.status === 'running') defaultLogs.push({ ts: '00:02.100', level: 'info', msg: 'Processing…' });
    logsHtml = defaultLogs.map(l => `<div class="log-line ${l.level}"><span class="ts">[${l.ts}]</span><span class="msg"> ${l.msg}</span></div>`).join('');
  }
  document.getElementById('lp-logs').innerHTML = logsHtml;

  document.getElementById('log-panel').classList.add('open');
}

function closePanel() {
  document.getElementById('log-panel').classList.remove('open');
}

function subscribeRealtime(uid) {
  if (sub) sub.unsubscribe();
  sub = window.sb.channel('exec-changes')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'executions', filter: `user_id=eq.${uid}` }, payload => {
      all.unshift(payload.new);
      stats(); filt();
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'executions', filter: `user_id=eq.${uid}` }, payload => {
      const idx = all.findIndex(e => e.id === payload.new.id);
      if (idx >= 0) all[idx] = payload.new;
      stats(); filt();
    })
    .subscribe();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePanel();
});

window.addEventListener('shellReady', load);
if (window.__shellReady) load();
</script>
</body>
</html>
