<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agents — NexaFlow Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/dashboard.css" />
  <link rel="stylesheet" href="styles/dashboard-inner.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <style>
    .agents-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(280px,1fr)); gap: 20px; }
    .agent-card {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 24px; position: relative; overflow: hidden;
      cursor: pointer; transition: all .3s;
    }
    .agent-card:hover { border-color: rgba(0,245,255,0.3); background: rgba(0,245,255,0.03); transform: translateY(-2px); }
    .agent-card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:3px;
      background: var(--grad);
    }
    .agent-emoji { font-size: 36px; margin-bottom: 12px; display: block; }
    .agent-name { font-size: 15px; font-weight: 600; color: #e8f4f8; margin: 0 0 4px; }
    .agent-type { font-size: 11px; color: rgba(232,244,248,0.4); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 12px; }
    .agent-desc { font-size: 12px; color: rgba(232,244,248,0.6); line-height: 1.5; margin-bottom: 16px; min-height: 36px; }
    .agent-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .agent-stat { text-align: center; }
    .agent-stat-val { font-size: 16px; font-weight: 700; color: #e8f4f8; font-family: 'JetBrains Mono', monospace; }
    .agent-stat-lbl { font-size: 10px; color: rgba(232,244,248,0.4); }
    .activity-bars { display: flex; align-items: flex-end; gap: 2px; height: 32px; margin-bottom: 14px; }
    .activity-bar { flex: 1; border-radius: 2px 2px 0 0; transition: height .8s ease; }
    .agent-footer { display: flex; align-items: center; justify-content: space-between; }
    .agent-model { font-size: 10px; color: rgba(232,244,248,0.35); font-family: 'JetBrains Mono', monospace; }
    .agent-actions { display: flex; gap: 6px; }
    .agent-btn {
      padding: 5px 12px; border-radius: 6px; font-size: 11px; cursor: pointer;
      border: 1px solid; transition: all .2s;
    }
    .agent-btn.pause {
      background: rgba(255,200,0,0.1); border-color: rgba(255,200,0,0.3); color: #ffc800;
    }
    .agent-btn.pause:hover { background: rgba(255,200,0,0.2); }
    .agent-btn.activate {
      background: rgba(0,255,136,0.1); border-color: rgba(0,255,136,0.3); color: #00ff88;
    }
    .agent-btn.activate:hover { background: rgba(0,255,136,0.2); }
    .agent-btn.edit {
      background: rgba(0,245,255,0.1); border-color: rgba(0,245,255,0.3); color: #00f5ff;
    }
    .agent-btn.edit:hover { background: rgba(0,245,255,0.2); }
    .agent-btn.delete {
      background: rgba(255,77,109,0.1); border-color: rgba(255,77,109,0.3); color: #ff4d6d;
    }
    .agent-btn.delete:hover { background: rgba(255,77,109,0.2); }

    /* Detail Panel */
    .agent-panel {
      position: fixed; right: 0; top: 0; bottom: 0; width: 440px;
      background: #0a0a0f; border-left: 1px solid rgba(0,245,255,0.15);
      transform: translateX(100%); transition: transform .3s ease;
      z-index: 200; display: flex; flex-direction: column; overflow: hidden;
    }
    .agent-panel.open { transform: translateX(0); }
    .agent-panel-header {
      padding: 24px; border-bottom: 1px solid rgba(0,245,255,0.1);
      display: flex; align-items: center; gap: 16px;
    }
    .agent-panel-emoji { font-size: 40px; }
    .agent-panel-info { flex: 1; }
    .agent-panel-info h3 { font-size: 16px; font-weight: 600; color: #e8f4f8; margin: 0 0 4px; }
    .agent-panel-info p { font-size: 12px; color: rgba(232,244,248,0.4); margin: 0; text-transform: uppercase; letter-spacing: .06em; }
    .panel-close {
      background: none; border: none; color: rgba(232,244,248,0.4);
      cursor: pointer; font-size: 20px; padding: 4px; transition: color .2s;
    }
    .panel-close:hover { color: #e8f4f8; }
    .agent-panel-body { flex: 1; overflow-y: auto; padding: 24px; }
    .panel-section { margin-bottom: 24px; }
    .panel-section h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: rgba(232,244,248,0.4); margin: 0 0 12px; }
    .panel-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .panel-stat-box {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px; padding: 14px;
    }
    .panel-stat-box .val { font-size: 22px; font-weight: 700; color: #e8f4f8; font-family: 'JetBrains Mono',monospace; }
    .panel-stat-box .lbl { font-size: 11px; color: rgba(232,244,248,0.4); margin-top: 4px; }
    .live-log {
      background: rgba(0,0,0,0.4); border: 1px solid rgba(0,245,255,0.1);
      border-radius: 10px; padding: 14px; height: 160px; overflow-y: auto;
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
    }
    .log-line { padding: 2px 0; }
    .log-line .ts { color: rgba(232,244,248,0.3); margin-right: 8px; }
    .log-line.info .msg { color: rgba(232,244,248,0.7); }
    .log-line.success .msg { color: #00ff88; }
    .log-line.error .msg { color: #ff4d6d; }

    /* Create/Edit Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
      z-index: 300; display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #0f1117; border: 1px solid rgba(0,245,255,0.2); border-radius: 20px;
      padding: 32px; width: 520px; max-width: 95vw; max-height: 85vh; overflow-y: auto;
    }
    .modal-title { font-size: 20px; font-weight: 700; color: #e8f4f8; margin: 0 0 4px; }
    .modal-sub { font-size: 13px; color: rgba(232,244,248,0.5); margin: 0 0 24px; }
    .form-row { margin-bottom: 18px; }
    .form-row label { display: block; font-size: 12px; color: rgba(232,244,248,0.6); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .06em; }
    .form-input, .form-select, .form-textarea {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; padding: 12px 14px; color: #e8f4f8; font-size: 14px;
      font-family: inherit; box-sizing: border-box; transition: border-color .2s;
    }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none; border-color: rgba(0,245,255,0.5);
    }
    .form-select option { background: #0f1117; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
    .btn-cancel {
      padding: 10px 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: rgba(232,244,248,0.7); border-radius: 10px; cursor: pointer; font-size: 14px; transition: all .2s;
    }
    .btn-cancel:hover { background: rgba(255,255,255,0.1); }
    .btn-save {
      padding: 10px 24px; background: linear-gradient(135deg,#00f5ff,#0080ff);
      border: none; color: #000; border-radius: 10px; cursor: pointer; font-size: 14px;
      font-weight: 600; transition: all .2s;
    }
    .btn-save:hover { opacity: .85; }
  </style>
</head>
<body>
<div class="dash-layout">
  <!-- sidebar injected by shell.js -->
  <main class="dash-main">
    <div class="dash-topbar">
      <div>
        <h1 class="dash-page-title">AI Agents</h1>
        <p class="dash-page-sub">Configure and monitor your autonomous agents</p>
      </div>
      <button class="btn-save" style="padding:10px 20px;border-radius:10px;font-size:13px" onclick="openCreate()">+ New Agent</button>
    </div>

    <!-- Stats -->
    <div class="dash-stats-row">
      <div class="dash-stat-card"><div class="dsc-label">Total Agents</div><div class="dsc-value" id="s-total">—</div></div>
      <div class="dash-stat-card"><div class="dsc-label">Active</div><div class="dsc-value" style="color:#00ff88" id="s-active">—</div></div>
      <div class="dash-stat-card"><div class="dsc-label">Idle</div><div class="dsc-value" style="color:#00f5ff" id="s-idle">—</div></div>
      <div class="dash-stat-card"><div class="dsc-label">Tasks Completed</div><div class="dsc-value" id="s-tasks">—</div></div>
    </div>

    <!-- Filters -->
    <div class="dash-filter-bar" style="margin-top:24px">
      <input id="q" class="dash-filter-input" placeholder="Search agents…" oninput="filt()" />
      <select id="f-status" class="dash-filter-select" onchange="filt()">
        <option value="">All Statuses</option>
        <option value="active">Active</option>
        <option value="idle">Idle</option>
        <option value="error">Error</option>
      </select>
      <select id="f-type" class="dash-filter-select" onchange="filt()">
        <option value="">All Types</option>
        <option value="classifier">Classifier</option>
        <option value="extractor">Extractor</option>
        <option value="writer">Writer</option>
        <option value="analyzer">Analyzer</option>
        <option value="router">Router</option>
        <option value="validator">Validator</option>
        <option value="generator">Generator</option>
      </select>
    </div>

    <!-- Agents Grid -->
    <div class="agents-grid" id="agents-grid" style="margin-top:20px">
      <div style="text-align:center;padding:60px;color:rgba(232,244,248,0.3);grid-column:1/-1">Loading agents…</div>
    </div>
  </main>
</div>

<!-- Agent Detail Panel -->
<div class="agent-panel" id="agent-panel">
  <div class="agent-panel-header">
    <span class="agent-panel-emoji" id="ap-emoji">🤖</span>
    <div class="agent-panel-info">
      <h3 id="ap-name">Agent Name</h3>
      <p id="ap-type">type</p>
    </div>
    <span id="ap-status"></span>
    <button class="panel-close" onclick="closePanel()">✕</button>
  </div>
  <div class="agent-panel-body">
    <div class="panel-section">
      <h4>Performance</h4>
      <div class="panel-stat-grid">
        <div class="panel-stat-box"><div class="val" id="ap-tasks">—</div><div class="lbl">Tasks Completed</div></div>
        <div class="panel-stat-box"><div class="val" id="ap-rate">—</div><div class="lbl">Success Rate</div></div>
        <div class="panel-stat-box"><div class="val" id="ap-resp">—</div><div class="lbl">Avg Response</div></div>
        <div class="panel-stat-box"><div class="val" id="ap-model">—</div><div class="lbl">Model</div></div>
      </div>
    </div>
    <div class="panel-section">
      <h4>Description</h4>
      <p id="ap-desc" style="font-size:13px;color:rgba(232,244,248,0.6);line-height:1.6;margin:0"></p>
    </div>
    <div class="panel-section">
      <h4>Live Activity</h4>
      <div class="live-log" id="ap-log"></div>
    </div>
  </div>
</div>

<!-- Create/Edit Modal -->
<div class="modal-overlay" id="agent-modal">
  <div class="modal-box">
    <h2 class="modal-title" id="modal-title">New Agent</h2>
    <p class="modal-sub" id="modal-sub">Configure your AI agent</p>
    <input type="hidden" id="edit-id" />
    <div class="form-grid">
      <div class="form-row">
        <label>Agent Name *</label>
        <input id="f-name" class="form-input" placeholder="Email Classifier" />
      </div>
      <div class="form-row">
        <label>Emoji</label>
        <input id="f-emoji" class="form-input" placeholder="🤖" maxlength="2" />
      </div>
    </div>
    <div class="form-row">
      <label>Description</label>
      <textarea id="f-desc" class="form-textarea" placeholder="What does this agent do?"></textarea>
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>Type *</label>
        <select id="f-type-m" class="form-select">
          <option value="classifier">Classifier</option>
          <option value="extractor">Extractor</option>
          <option value="writer">Writer</option>
          <option value="analyzer">Analyzer</option>
          <option value="router">Router</option>
          <option value="validator">Validator</option>
          <option value="generator">Generator</option>
          <option value="support">Support</option>
          <option value="translation">Translation</option>
          <option value="review">Review</option>
        </select>
      </div>
      <div class="form-row">
        <label>Model</label>
        <select id="f-model" class="form-select">
          <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
          <option value="claude-opus-4-6">Claude Opus 4.6</option>
          <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5</option>
        </select>
      </div>
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>Status</label>
        <select id="f-status-m" class="form-select">
          <option value="active">Active</option>
          <option value="idle">Idle</option>
        </select>
      </div>
      <div class="form-row">
        <label>Gradient From</label>
        <input id="f-color-from" class="form-input" type="color" value="#00f5ff" style="height:46px;cursor:pointer" />
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveAgent()">Save Agent</button>
    </div>
  </div>
</div>

<script src="js/shell.js"></script>
<script>
let all = [], filtered = [], logInterval;

async function load() {
  const uid = window.__currentUser?.id;
  if (!uid) return;

  const { data, error } = await window.sb
    .from('agents')
    .select('*')
    .eq('user_id', uid)
    .order('created_at', { ascending: false });

  if (error) { console.error(error); return; }
  all = data || [];
  renderStats();
  filt();
}

function renderStats() {
  document.getElementById('s-total').textContent = all.length;
  document.getElementById('s-active').textContent = all.filter(a => a.status === 'active').length;
  document.getElementById('s-idle').textContent = all.filter(a => a.status === 'idle').length;
  const tasks = all.reduce((s, a) => s + (a.tasks_completed || 0), 0);
  document.getElementById('s-tasks').textContent = window.fmtNum(tasks);
}

function filt() {
  const q = document.getElementById('q').value.toLowerCase();
  const fs = document.getElementById('f-status').value;
  const ft = document.getElementById('f-type').value;

  filtered = all.filter(a => {
    if (q && !a.name.toLowerCase().includes(q) && !(a.description||'').toLowerCase().includes(q)) return false;
    if (fs && a.status !== fs) return false;
    if (ft && a.type !== ft) return false;
    return true;
  });
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('agents-grid');
  if (!filtered.length) {
    grid.innerHTML = '<div style="text-align:center;padding:60px;color:rgba(232,244,248,0.3);grid-column:1/-1">No agents found</div>';
    return;
  }

  grid.innerHTML = filtered.map(a => {
    const stMap = { active: '#00ff88', idle: '#00f5ff', error: '#ff4d6d' };
    const color = stMap[a.status] || '#e8f4f8';
    const grad = `linear-gradient(135deg, ${a.color_from||'#00f5ff'}, ${a.color_to||'#0080ff'})`;
    const bars = Array.from({length:14}, () => {
      const h = a.status === 'idle' ? Math.floor(Math.random()*20+4) : Math.floor(Math.random()*90+10);
      return `<div class="activity-bar" style="height:${h}%;background:${a.color_from||'#00f5ff'};opacity:${a.status==='idle'?0.3:0.7}"></div>`;
    }).join('');

    const toggleBtn = a.status === 'active'
      ? `<button class="agent-btn pause" onclick="event.stopPropagation();toggleStatus('${a.id}','active')">Pause</button>`
      : `<button class="agent-btn activate" onclick="event.stopPropagation();toggleStatus('${a.id}','${a.status}')">Activate</button>`;

    return `<div class="agent-card" style="--grad:${grad}" onclick="openPanel('${a.id}')">
      <span class="agent-emoji">${a.emoji||'🤖'}</span>
      <h3 class="agent-name">${a.name}</h3>
      <p class="agent-type">${a.type} · <span style="color:${color}">${a.status}</span></p>
      <p class="agent-desc">${a.description||'No description provided.'}</p>
      <div class="agent-stats">
        <div class="agent-stat"><div class="agent-stat-val">${window.fmtNum(a.tasks_completed||0)}</div><div class="agent-stat-lbl">Tasks</div></div>
        <div class="agent-stat"><div class="agent-stat-val">${a.success_rate||99}%</div><div class="agent-stat-lbl">Success</div></div>
        <div class="agent-stat"><div class="agent-stat-val">${a.avg_response_ms||500}ms</div><div class="agent-stat-lbl">Avg Resp</div></div>
      </div>
      <div class="activity-bars">${bars}</div>
      <div class="agent-footer">
        <span class="agent-model">${a.model||'claude-sonnet-4-6'}</span>
        <div class="agent-actions" onclick="event.stopPropagation()">
          ${toggleBtn}
          <button class="agent-btn edit" onclick="openEdit('${a.id}')">Edit</button>
          <button class="agent-btn delete" onclick="delAgent('${a.id}')">Del</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function toggleStatus(id, current) {
  const newStatus = current === 'active' ? 'idle' : 'active';
  await window.sb.from('agents').update({ status: newStatus }).eq('id', id);
  const idx = all.findIndex(a => a.id === id);
  if (idx >= 0) all[idx].status = newStatus;
  renderStats(); filt();
  window.showToast(`Agent ${newStatus === 'active' ? 'activated' : 'paused'}`, 'success');
}

async function delAgent(id) {
  if (!confirm('Delete this agent? This cannot be undone.')) return;
  await window.sb.from('agents').delete().eq('id', id);
  all = all.filter(a => a.id !== id);
  renderStats(); filt();
  window.showToast('Agent deleted', 'warning');
}

function openPanel(id) {
  const a = all.find(x => x.id === id);
  if (!a) return;
  const panel = document.getElementById('agent-panel');

  document.getElementById('ap-emoji').textContent = a.emoji || '🤖';
  document.getElementById('ap-name').textContent = a.name;
  document.getElementById('ap-type').textContent = a.type;
  const stMap = { active: 'active', idle: 'running', error: 'error' };
  document.getElementById('ap-status').innerHTML = `<span class="badge ${stMap[a.status]||''}">${a.status}</span>`;
  document.getElementById('ap-tasks').textContent = window.fmtNum(a.tasks_completed || 0);
  document.getElementById('ap-rate').textContent = (a.success_rate || 99) + '%';
  document.getElementById('ap-resp').textContent = (a.avg_response_ms || 500) + 'ms';
  document.getElementById('ap-model').textContent = (a.model || 'claude-sonnet-4-6').replace('claude-', '').replace('-4-6', ' 4.6').replace('-4-5-20251001', ' 4.5');
  document.getElementById('ap-desc').textContent = a.description || 'No description provided.';

  panel.classList.add('open');
  startLiveLog(a);
}

function startLiveLog(agent) {
  const logEl = document.getElementById('ap-log');
  logEl.innerHTML = '';
  if (logInterval) clearInterval(logInterval);

  const messages = [
    { level: 'info', msg: 'Agent initialized' },
    { level: 'info', msg: `Model: ${agent.model||'claude-sonnet-4-6'}` },
    { level: 'success', msg: 'Ready to process tasks' },
    { level: 'info', msg: 'Watching for new inputs…' },
    { level: 'info', msg: 'Processing batch #' + Math.floor(Math.random()*9000+1000) },
    { level: 'success', msg: 'Task completed in ' + Math.floor(Math.random()*800+200) + 'ms' },
    { level: 'info', msg: 'Confidence: ' + (Math.random()*0.1+0.89).toFixed(3) },
    { level: 'info', msg: 'Queue depth: ' + Math.floor(Math.random()*5) },
  ];
  let i = 0;

  const addLine = () => {
    const l = messages[i % messages.length];
    const ts = new Date().toTimeString().split(' ')[0];
    const line = document.createElement('div');
    line.className = `log-line ${l.level}`;
    line.innerHTML = `<span class="ts">[${ts}]</span><span class="msg"> ${l.msg}</span>`;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
    if (logEl.children.length > 30) logEl.removeChild(logEl.firstChild);
    i++;
  };
  addLine();
  logInterval = setInterval(addLine, agent.status === 'active' ? 1200 : 3000);
}

function closePanel() {
  document.getElementById('agent-panel').classList.remove('open');
  if (logInterval) clearInterval(logInterval);
}

function openCreate() {
  document.getElementById('modal-title').textContent = 'New Agent';
  document.getElementById('modal-sub').textContent = 'Configure your AI agent';
  document.getElementById('edit-id').value = '';
  document.getElementById('f-name').value = '';
  document.getElementById('f-emoji').value = '🤖';
  document.getElementById('f-desc').value = '';
  document.getElementById('f-type-m').value = 'classifier';
  document.getElementById('f-model').value = 'claude-sonnet-4-6';
  document.getElementById('f-status-m').value = 'active';
  document.getElementById('f-color-from').value = '#00f5ff';
  document.getElementById('agent-modal').classList.add('open');
}

function openEdit(id) {
  const a = all.find(x => x.id === id);
  if (!a) return;
  document.getElementById('modal-title').textContent = 'Edit Agent';
  document.getElementById('modal-sub').textContent = 'Update agent configuration';
  document.getElementById('edit-id').value = a.id;
  document.getElementById('f-name').value = a.name;
  document.getElementById('f-emoji').value = a.emoji || '🤖';
  document.getElementById('f-desc').value = a.description || '';
  document.getElementById('f-type-m').value = a.type || 'classifier';
  document.getElementById('f-model').value = a.model || 'claude-sonnet-4-6';
  document.getElementById('f-status-m').value = a.status || 'active';
  document.getElementById('f-color-from').value = a.color_from || '#00f5ff';
  document.getElementById('agent-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('agent-modal').classList.remove('open');
}

async function saveAgent() {
  const editId = document.getElementById('edit-id').value;
  const name = document.getElementById('f-name').value.trim();
  if (!name) { window.showToast('Agent name is required', 'error'); return; }
  const uid = window.__currentUser?.id;

  const payload = {
    user_id: uid,
    name,
    emoji: document.getElementById('f-emoji').value || '🤖',
    description: document.getElementById('f-desc').value.trim(),
    type: document.getElementById('f-type-m').value,
    model: document.getElementById('f-model').value,
    status: document.getElementById('f-status-m').value,
    color_from: document.getElementById('f-color-from').value,
    color_to: '#0080ff',
  };

  if (editId) {
    const { data } = await window.sb.from('agents').update(payload).eq('id', editId).select().single();
    if (data) {
      const idx = all.findIndex(a => a.id === editId);
      if (idx >= 0) all[idx] = { ...all[idx], ...data };
    }
    window.showToast('Agent updated', 'success');
  } else {
    const { data } = await window.sb.from('agents').insert(payload).select().single();
    if (data) all.unshift(data);
    window.showToast('Agent created', 'success');
  }

  closeModal();
  renderStats(); filt();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePanel(); closeModal(); }
});

window.addEventListener('shellReady', load);
if (window.__shellReady) load();
</script>
</body>
</html>
