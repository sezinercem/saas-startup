<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Integrations — NexaFlow Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/dashboard.css" />
  <link rel="stylesheet" href="styles/dashboard-inner.css" />
  <style>
    .integrations-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .integration-card-dash {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .integration-card-dash:hover {
      border-color: rgba(0,245,255,0.15);
      background: rgba(0,245,255,0.02);
      transform: translateY(-1px);
    }
    .integration-card-dash.connected {
      border-color: rgba(0,255,135,0.15);
    }
    .int-logo {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }
    .int-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .int-card-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .int-card-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--color-text-primary);
    }
    .int-card-category {
      font-size: 0.72rem;
      color: var(--color-text-muted);
    }
    .int-card-desc {
      font-size: 0.8rem;
      color: var(--color-text-muted);
      line-height: 1.5;
    }
    .int-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.875rem;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .int-usage {
      font-size: 0.72rem;
      color: var(--color-text-muted);
    }
    .int-connect-btn {
      padding: 0.35rem 0.875rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-body);
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .int-connect-btn.connect {
      background: rgba(0,245,255,0.1);
      color: var(--color-neon-cyan);
      border-color: rgba(0,245,255,0.2);
    }
    .int-connect-btn.connect:hover {
      background: rgba(0,245,255,0.2);
    }
    .int-connect-btn.disconnect {
      background: rgba(239,68,68,0.08);
      color: #ef4444;
      border-color: rgba(239,68,68,0.15);
    }
    .int-connect-btn.disconnect:hover {
      background: rgba(239,68,68,0.15);
    }
    .cat-tabs {
      display: flex;
      gap: 0.375rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .cat-tab {
      padding: 0.4rem 0.875rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.08);
      background: transparent;
      color: var(--color-text-muted);
      font-family: var(--font-body);
      transition: all 0.2s;
    }
    .cat-tab:hover { color: var(--color-text-primary); border-color: rgba(255,255,255,0.15); }
    .cat-tab.active {
      background: rgba(0,245,255,0.08);
      border-color: rgba(0,245,255,0.25);
      color: var(--color-neon-cyan);
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="grid-overlay"></div>
  <div class="ambient-orb" style="top:-20%;right:-10%;width:600px;height:600px;background:radial-gradient(circle,rgba(139,92,246,0.07) 0%,transparent 70%)"></div>

  <div class="dash-layout">
    <aside class="dash-sidebar">
      <div class="dash-sidebar-logo">
        <div class="sidebar-logo-icon">
          <svg width="20" height="20" viewBox="0 0 32 32" fill="none">
            <path d="M16 2L28 8V16C28 22.627 22.627 28 16 28C9.373 28 4 22.627 4 16V8L16 2Z" stroke="url(#sg)" stroke-width="2" fill="none"/>
            <circle cx="16" cy="16" r="4" fill="url(#sg2)"/>
            <path d="M16 8V12M16 20V24M8 16H12M20 16H24" stroke="url(#sg)" stroke-width="1.5" stroke-linecap="round"/>
            <defs>
              <linearGradient id="sg" x1="4" y1="2" x2="28" y2="28" gradientUnits="userSpaceOnUse"><stop stop-color="#00f5ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
              <linearGradient id="sg2" x1="12" y1="12" x2="20" y2="20" gradientUnits="userSpaceOnUse"><stop stop-color="#00f5ff"/><stop offset="1" stop-color="#0080ff"/></linearGradient>
            </defs>
          </svg>
        </div>
        <span class="sidebar-logo-text">NexaFlow</span>
      </div>
      <nav class="dash-sidebar-nav">
        <div class="sidebar-nav-section">
          <div class="sidebar-nav-label">Main</div>
          <a href="dashboard.html" class="sidebar-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Overview</a>
          <a href="dashboard-workflows.html" class="sidebar-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 6h8M8 12h5M8 18h3"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Workflows</a>
          <a href="dashboard-agents.html" class="sidebar-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a4 4 0 014-4h4a4 4 0 014 4v2"/></svg>AI Agents</a>
          <a href="dashboard-executions.html" class="sidebar-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Executions</a>
          <a href="dashboard-analytics.html" class="sidebar-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 20h18M5 20V12l7-7 7 7v8"/></svg>Analytics</a>
        </div>
        <div class="sidebar-nav-section">
          <div class="sidebar-nav-label">Configure</div>
          <a href="dashboard-integrations.html" class="sidebar-link active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>Integrations</a>
          <a href="dashboard-team.html" class="sidebar-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Team</a>
          <a href="dashboard-settings.html" class="sidebar-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/></svg>Settings</a>
        </div>
      </nav>
      <div class="sidebar-user">
        <div class="sidebar-user-avatar">JS</div>
        <div class="sidebar-user-info"><div class="sidebar-user-name">Jordan Smith</div><div class="sidebar-user-role">Admin</div></div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:0.4;margin-left:auto;flex-shrink:0"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </aside>

    <main class="dash-main">
      <header class="dash-topbar">
        <div class="dash-topbar-left">
          <h2 class="dash-page-title">Integrations</h2>
          <div class="dash-breadcrumb" style="margin:0;font-size:0.78rem"><a href="dashboard.html">Dashboard</a><span class="sep">/</span><span class="current">Integrations</span></div>
        </div>
        <div class="dash-topbar-right">
          <div class="dash-filter-wrap" style="max-width:280px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" class="dash-filter-input" placeholder="Search integrations…" id="intSearch" />
          </div>
        </div>
      </header>

      <div class="dash-content">
        <!-- Stats -->
        <div class="dash-stats-row">
          <div class="dash-stat-card" style="--stat-gradient:linear-gradient(135deg,rgba(0,255,135,0.06) 0%,transparent 60%)">
            <div class="dash-stat-label">Connected</div>
            <div class="dash-stat-value">12</div>
            <div class="dash-stat-delta up">All healthy</div>
          </div>
          <div class="dash-stat-card" style="--stat-gradient:linear-gradient(135deg,rgba(0,245,255,0.06) 0%,transparent 60%)">
            <div class="dash-stat-label">Available</div>
            <div class="dash-stat-value">300+</div>
            <div class="dash-stat-delta neutral">One-click setup</div>
          </div>
          <div class="dash-stat-card" style="--stat-gradient:linear-gradient(135deg,rgba(139,92,246,0.06) 0%,transparent 60%)">
            <div class="dash-stat-label">API Calls Today</div>
            <div class="dash-stat-value">1.2M</div>
            <div class="dash-stat-delta up">↑ 8% vs yesterday</div>
          </div>
          <div class="dash-stat-card" style="--stat-gradient:linear-gradient(135deg,rgba(245,158,11,0.06) 0%,transparent 60%)">
            <div class="dash-stat-label">Webhooks Active</div>
            <div class="dash-stat-value">34</div>
            <div class="dash-stat-delta neutral">Across 12 services</div>
          </div>
        </div>

        <!-- Category tabs -->
        <div class="cat-tabs" id="catTabs">
          <button class="cat-tab active" data-cat="all">All (32)</button>
          <button class="cat-tab" data-cat="connected">Connected (12)</button>
          <button class="cat-tab" data-cat="crm">CRM</button>
          <button class="cat-tab" data-cat="communication">Communication</button>
          <button class="cat-tab" data-cat="data">Data & Analytics</button>
          <button class="cat-tab" data-cat="devops">DevOps</button>
          <button class="cat-tab" data-cat="payments">Payments</button>
          <button class="cat-tab" data-cat="productivity">Productivity</button>
        </div>

        <!-- Grid -->
        <div class="integrations-grid" id="intGrid"></div>
      </div>
    </main>
  </div>

  <script src="js/particles.js"></script>
  <script>
    const integrations = [
      { emoji: '🔵', name: 'Salesforce', cat: 'crm', desc: 'Sync leads, contacts, deals, and activity data bidirectionally with your CRM.', connected: true, calls: '48K/day', webhooks: 6 },
      { emoji: '🟠', name: 'HubSpot', cat: 'crm', desc: 'Connect HubSpot contacts, companies, deals, and email campaigns.', connected: true, calls: '32K/day', webhooks: 4 },
      { emoji: '🟣', name: 'Slack', cat: 'communication', desc: 'Send messages, create channels, and trigger workflows from Slack events.', connected: true, calls: '12K/day', webhooks: 3 },
      { emoji: '📧', name: 'Gmail', cat: 'communication', desc: 'Read, send, and classify emails. Trigger workflows on new messages.', connected: true, calls: '28K/day', webhooks: 2 },
      { emoji: '🐙', name: 'GitHub', cat: 'devops', desc: 'Trigger workflows on PRs, issues, commits, and deployments.', connected: true, calls: '8K/day', webhooks: 8 },
      { emoji: '💳', name: 'Stripe', cat: 'payments', desc: 'Automate billing, invoicing, subscription management, and charge events.', connected: true, calls: '22K/day', webhooks: 5 },
      { emoji: '📊', name: 'BigQuery', cat: 'data', desc: 'Query and write to Google BigQuery datasets as workflow steps.', connected: true, calls: '15K/day', webhooks: 0 },
      { emoji: '🔷', name: 'Jira', cat: 'devops', desc: 'Create, update, and track Jira issues from automated workflows.', connected: true, calls: '6K/day', webhooks: 3 },
      { emoji: '📮', name: 'Mailchimp', cat: 'communication', desc: 'Add subscribers, send campaigns, and track email performance metrics.', connected: false, calls: '', webhooks: 0 },
      { emoji: '🔴', name: 'Intercom', cat: 'crm', desc: 'Sync customer data, create conversations, and trigger support workflows.', connected: true, calls: '9K/day', webhooks: 2 },
      { emoji: '📦', name: 'Snowflake', cat: 'data', desc: 'Read and write to Snowflake data warehouse. Run SQL queries as workflow steps.', connected: false, calls: '', webhooks: 0 },
      { emoji: '🟡', name: 'Zendesk', cat: 'crm', desc: 'Create, update, and resolve support tickets automatically from workflows.', connected: true, calls: '11K/day', webhooks: 4 },
      { emoji: '📅', name: 'Google Calendar', cat: 'productivity', desc: 'Create events, check availability, and trigger workflows on calendar changes.', connected: false, calls: '', webhooks: 0 },
      { emoji: '📝', name: 'Notion', cat: 'productivity', desc: 'Read and write Notion pages, databases, and blocks from workflows.', connected: false, calls: '', webhooks: 0 },
      { emoji: '🔗', name: 'Linear', cat: 'devops', desc: 'Create issues, update project status, and sync with GitHub automatically.', connected: false, calls: '', webhooks: 0 },
      { emoji: '💜', name: 'Twilio', cat: 'communication', desc: 'Send SMS, WhatsApp messages, and make voice calls from workflows.', connected: false, calls: '', webhooks: 0 },
      { emoji: '🟤', name: 'Airtable', cat: 'data', desc: 'Read and write Airtable bases as structured workflow data sources.', connected: false, calls: '', webhooks: 0 },
      { emoji: '🔶', name: 'AWS S3', cat: 'devops', desc: 'Upload, download, and process files from Amazon S3 buckets.', connected: true, calls: '4K/day', webhooks: 1 },
      { emoji: '🟩', name: 'Mixpanel', cat: 'data', desc: 'Track events, query funnels, and export user analytics data.', connected: false, calls: '', webhooks: 0 },
      { emoji: '🎨', name: 'Figma', cat: 'productivity', desc: 'Access design files, comments, and trigger workflows on design events.', connected: false, calls: '', webhooks: 0 },
      { emoji: '🐳', name: 'Docker', cat: 'devops', desc: 'Build, push, and deploy Docker containers from automated workflows.', connected: false, calls: '', webhooks: 0 },
      { emoji: '📡', name: 'Segment', cat: 'data', desc: 'Receive and send Segment track, identify, and group events.', connected: false, calls: '', webhooks: 0 },
      { emoji: '💰', name: 'QuickBooks', cat: 'payments', desc: 'Sync invoices, expenses, and customer data with QuickBooks Online.', connected: false, calls: '', webhooks: 0 },
      { emoji: '📱', name: 'Webflow', cat: 'productivity', desc: 'Trigger workflows from Webflow form submissions and CMS changes.', connected: false, calls: '', webhooks: 0 },
    ];

    function renderIntegrations(list) {
      const grid = document.getElementById('intGrid');
      grid.innerHTML = '';

      list.forEach(int => {
        const card = document.createElement('div');
        card.className = `integration-card-dash ${int.connected ? 'connected' : ''}`;

        card.innerHTML = `
          <div class="int-card-header">
            <div class="int-card-info">
              <div class="int-logo" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06)">${int.emoji}</div>
              <div>
                <div class="int-card-name">${int.name}</div>
                <div class="int-card-category">${int.cat.charAt(0).toUpperCase() + int.cat.slice(1)}</div>
              </div>
            </div>
            ${int.connected ? '<span class="badge success" style="font-size:0.65rem"><span class="badge-dot"></span>connected</span>' : ''}
          </div>
          <div class="int-card-desc">${int.desc}</div>
          <div class="int-card-footer">
            <div class="int-usage">${int.connected ? `${int.calls} · ${int.webhooks} webhooks` : '—'}</div>
            <button class="int-connect-btn ${int.connected ? 'disconnect' : 'connect'}" data-name="${int.name}">
              ${int.connected ? 'Disconnect' : 'Connect'}
            </button>
          </div>
        `;

        grid.appendChild(card);
      });

      // Connect/disconnect toggle
      grid.querySelectorAll('.int-connect-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const origText = btn.textContent.trim();
          btn.textContent = origText === 'Connect' ? 'Connecting…' : 'Disconnecting…';
          btn.disabled = true;
          setTimeout(() => {
            if (origText === 'Connect') {
              btn.textContent = 'Disconnect';
              btn.className = 'int-connect-btn disconnect';
              btn.closest('.integration-card-dash').classList.add('connected');
            } else {
              btn.textContent = 'Connect';
              btn.className = 'int-connect-btn connect';
              btn.closest('.integration-card-dash').classList.remove('connected');
            }
            btn.disabled = false;
          }, 1200);
        });
      });
    }

    renderIntegrations(integrations);

    // Category filter
    document.getElementById('catTabs').querySelectorAll('.cat-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        const cat = this.dataset.cat;
        if (cat === 'all') renderIntegrations(integrations);
        else if (cat === 'connected') renderIntegrations(integrations.filter(i => i.connected));
        else renderIntegrations(integrations.filter(i => i.cat === cat));
      });
    });

    // Search
    document.getElementById('intSearch').addEventListener('input', function() {
      const q = this.value.toLowerCase();
      if (!q) { renderIntegrations(integrations); return; }
      renderIntegrations(integrations.filter(i => i.name.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q) || i.cat.toLowerCase().includes(q)));
    });
  </script>
</body>
</html>
