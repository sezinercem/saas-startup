<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Integrations — NexaFlow Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/dashboard.css" />
  <link rel="stylesheet" href="styles/dashboard-inner.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <style>
    .cat-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .cat-tab {
      padding: 6px 16px; border-radius: 20px; font-size: 12px; cursor: pointer;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      color: rgba(232,244,248,0.5); transition: all .2s;
    }
    .cat-tab.active { background: rgba(0,245,255,0.15); border-color: rgba(0,245,255,0.3); color: #00f5ff; }
    .int-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .int-card {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; padding: 20px; transition: all .3s; position: relative;
    }
    .int-card.connected { border-color: rgba(0,255,136,0.2); }
    .int-card:hover { border-color: rgba(0,245,255,0.25); background: rgba(0,245,255,0.02); }
    .int-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .int-emoji { font-size: 28px; }
    .int-info { flex: 1; }
    .int-name { font-size: 14px; font-weight: 600; color: #e8f4f8; margin: 0 0 2px; }
    .int-cat { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: rgba(232,244,248,0.35); }
    .int-desc { font-size: 12px; color: rgba(232,244,248,0.5); line-height: 1.5; margin-bottom: 14px; min-height: 36px; }
    .int-stats { display: flex; gap: 16px; margin-bottom: 14px; }
    .int-stat { display: flex; flex-direction: column; gap: 2px; }
    .int-stat-val { font-size: 14px; font-weight: 600; color: #e8f4f8; font-family: 'JetBrains Mono', monospace; }
    .int-stat-lbl { font-size: 10px; color: rgba(232,244,248,0.35); }
    .int-footer { display: flex; align-items: center; justify-content: space-between; }
    .int-connected-at { font-size: 10px; color: rgba(232,244,248,0.3); }
    .connect-btn {
      padding: 6px 16px; border-radius: 8px; font-size: 12px; cursor: pointer;
      border: 1px solid; transition: all .25s; font-weight: 500;
    }
    .connect-btn.connect {
      background: rgba(0,245,255,0.1); border-color: rgba(0,245,255,0.3); color: #00f5ff;
    }
    .connect-btn.connect:hover { background: rgba(0,245,255,0.2); }
    .connect-btn.disconnect {
      background: rgba(255,77,109,0.08); border-color: rgba(255,77,109,0.25); color: #ff4d6d;
    }
    .connect-btn.disconnect:hover { background: rgba(255,77,109,0.15); }
    .connect-btn:disabled { opacity: .5; cursor: not-allowed; }
    .connected-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #00ff88;
      box-shadow: 0 0 6px #00ff88; flex-shrink: 0;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }
    .connecting-spinner {
      width: 14px; height: 14px; border: 2px solid rgba(0,245,255,0.2);
      border-top-color: #00f5ff; border-radius: 50%; animation: spin .7s linear infinite;
      display: inline-block; vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="dash-layout">
  <!-- sidebar injected by shell.js -->
  <main class="dash-main">
    <div class="dash-topbar">
      <div>
        <h1 class="dash-page-title">Integrations</h1>
        <p class="dash-page-sub">Connect your tools and services</p>
      </div>
      <div style="display:flex;gap:12px;align-items:center">
        <span id="connected-count" style="font-size:12px;color:rgba(232,244,248,0.5)">—</span>
      </div>
    </div>

    <!-- Stats -->
    <div class="dash-stats-row">
      <div class="dash-stat-card"><div class="dsc-label">Total</div><div class="dsc-value" id="s-total">—</div></div>
      <div class="dash-stat-card"><div class="dsc-label">Connected</div><div class="dsc-value" style="color:#00ff88" id="s-conn">—</div></div>
      <div class="dash-stat-card"><div class="dsc-label">API Calls Today</div><div class="dsc-value" id="s-api">—</div></div>
      <div class="dash-stat-card"><div class="dsc-label">Webhooks</div><div class="dsc-value" id="s-hooks">—</div></div>
    </div>

    <!-- Search & Category Tabs -->
    <div class="dash-filter-bar" style="margin-top:24px">
      <input id="q" class="dash-filter-input" placeholder="Search integrations…" oninput="filt()" />
      <select id="f-status" class="dash-filter-select" onchange="filt()">
        <option value="">All</option>
        <option value="connected">Connected</option>
        <option value="disconnected">Disconnected</option>
      </select>
    </div>
    <div class="cat-tabs" id="cat-tabs" style="margin-top:16px"></div>

    <!-- Grid -->
    <div class="int-grid" id="int-grid">
      <div style="text-align:center;padding:60px;color:rgba(232,244,248,0.3);grid-column:1/-1">Loading integrations…</div>
    </div>
  </main>
</div>

<script src="js/shell.js"></script>
<script>
let all = [], activeCat = 'all', connecting = new Set();

async function load() {
  const uid = window.__currentUser?.id;
  if (!uid) return;

  const { data } = await window.sb
    .from('integrations')
    .select('*')
    .eq('user_id', uid)
    .order('category')
    .order('name');

  all = data || [];
  renderStats();
  renderCatTabs();
  filt();
}

function renderStats() {
  const conn = all.filter(i => i.connected).length;
  const apiCalls = all.filter(i => i.connected).reduce((s, i) => s + (i.api_calls_today||0), 0);
  const webhooks = all.filter(i => i.connected).reduce((s, i) => s + (i.webhooks_count||0), 0);
  document.getElementById('s-total').textContent = all.length;
  document.getElementById('s-conn').textContent = conn;
  document.getElementById('s-api').textContent = window.fmtNum(apiCalls);
  document.getElementById('s-hooks').textContent = webhooks;
  document.getElementById('connected-count').textContent = `${conn} of ${all.length} connected`;
}

function renderCatTabs() {
  const cats = ['all', ...new Set(all.map(i => i.category))].sort();
  document.getElementById('cat-tabs').innerHTML = cats.map(c => `
    <button class="cat-tab ${c === activeCat ? 'active' : ''}" onclick="setCat('${c}')">
      ${c === 'all' ? 'All' : c.charAt(0).toUpperCase()+c.slice(1)}
    </button>
  `).join('');
}

function setCat(cat) {
  activeCat = cat;
  document.querySelectorAll('.cat-tab').forEach(t => {
    t.classList.toggle('active', t.textContent.trim().toLowerCase() === (cat === 'all' ? 'all' : cat));
  });
  filt();
}

function filt() {
  const q = document.getElementById('q').value.toLowerCase();
  const fs = document.getElementById('f-status').value;

  const filtered = all.filter(i => {
    if (activeCat !== 'all' && i.category !== activeCat) return false;
    if (q && !i.name.toLowerCase().includes(q) && !i.description.toLowerCase().includes(q)) return false;
    if (fs === 'connected' && !i.connected) return false;
    if (fs === 'disconnected' && i.connected) return false;
    return true;
  });
  renderGrid(filtered);
}

function renderGrid(items) {
  const grid = document.getElementById('int-grid');
  if (!items.length) {
    grid.innerHTML = '<div style="text-align:center;padding:60px;color:rgba(232,244,248,0.3);grid-column:1/-1">No integrations found</div>';
    return;
  }

  grid.innerHTML = items.map(i => {
    const isConnecting = connecting.has(i.id);
    let btnHtml;
    if (isConnecting) {
      btnHtml = `<button class="connect-btn connect" disabled><span class="connecting-spinner"></span>Connecting…</button>`;
    } else if (i.connected) {
      btnHtml = `<button class="connect-btn disconnect" onclick="toggle('${i.id}',true)">Disconnect</button>`;
    } else {
      btnHtml = `<button class="connect-btn connect" onclick="toggle('${i.id}',false)">Connect</button>`;
    }

    const connAt = i.connected && i.connected_at
      ? `Connected ${window.fmtTime(i.connected_at)}`
      : i.connected ? 'Connected' : 'Not connected';

    return `<div class="int-card ${i.connected ? 'connected' : ''}">
      <div class="int-header">
        <span class="int-emoji">${i.emoji||'🔗'}</span>
        <div class="int-info">
          <div class="int-name">${i.name}</div>
          <div class="int-cat">${i.category}</div>
        </div>
        ${i.connected ? '<span class="connected-dot"></span>' : ''}
      </div>
      <div class="int-desc">${i.description||'No description.'}</div>
      ${i.connected ? `<div class="int-stats">
        <div class="int-stat"><div class="int-stat-val">${window.fmtNum(i.api_calls_today||0)}</div><div class="int-stat-lbl">API calls today</div></div>
        <div class="int-stat"><div class="int-stat-val">${i.webhooks_count||0}</div><div class="int-stat-lbl">Webhooks</div></div>
      </div>` : '<div style="height:40px"></div>'}
      <div class="int-footer">
        <span class="int-connected-at">${connAt}</span>
        ${btnHtml}
      </div>
    </div>`;
  }).join('');
}

async function toggle(id, isConnected) {
  connecting.add(id);
  filt(); // re-render to show spinner

  await new Promise(r => setTimeout(r, 1200)); // simulate OAuth/API handshake

  const updates = isConnected
    ? { connected: false, api_calls_today: 0, webhooks_count: 0 }
    : { connected: true, connected_at: new Date().toISOString(), api_calls_today: Math.floor(Math.random()*200+10), webhooks_count: Math.floor(Math.random()*5+1) };

  const { data } = await window.sb.from('integrations').update(updates).eq('id', id).select().single();

  connecting.delete(id);
  if (data) {
    const idx = all.findIndex(i => i.id === id);
    if (idx >= 0) all[idx] = data;
  }
  renderStats();
  filt();
  window.showToast(isConnected ? 'Integration disconnected' : 'Integration connected!', isConnected ? 'warning' : 'success');
}

window.addEventListener('shellReady', load);
if (window.__shellReady) load();
</script>
</body>
</html>
