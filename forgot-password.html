<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — NexaFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/auth.css" />
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="grid-overlay"></div>
  <div class="ambient-orb" style="top:20%;left:10%;width:400px;height:400px;background:radial-gradient(circle,rgba(0,245,255,0.06) 0%,transparent 70%)"></div>

  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem">
    <div style="width:100%;max-width:420px">
      <div style="text-align:center;margin-bottom:2rem">
        <div class="auth-logo" style="justify-content:center">
          <div class="auth-logo-icon">
            <svg width="20" height="20" viewBox="0 0 32 32" fill="none">
              <path d="M16 2L28 8V16C28 22.627 22.627 28 16 28C9.373 28 4 22.627 4 16V8L16 2Z" stroke="url(#sg)" stroke-width="2" fill="none"/>
              <circle cx="16" cy="16" r="4" fill="url(#sg2)"/>
              <path d="M16 8V12M16 20V24M8 16H12M20 16H24" stroke="url(#sg)" stroke-width="1.5" stroke-linecap="round"/>
              <defs>
                <linearGradient id="sg" x1="4" y1="2" x2="28" y2="28" gradientUnits="userSpaceOnUse"><stop stop-color="#00f5ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
                <linearGradient id="sg2" x1="12" y1="12" x2="20" y2="20" gradientUnits="userSpaceOnUse"><stop stop-color="#00f5ff"/><stop offset="1" stop-color="#0080ff"/></linearGradient>
              </defs>
            </svg>
          </div>
          <span class="auth-logo-text">NexaFlow</span>
        </div>
      </div>

      <div class="auth-card">
        <!-- Step 1: Enter email -->
        <div id="step1">
          <div class="auth-card-header" style="text-align:center">
            <div style="width:52px;height:52px;border-radius:14px;background:rgba(0,245,255,0.08);border:1px solid rgba(0,245,255,0.2);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-neon-cyan)" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            </div>
            <h1 class="auth-title">Reset your password</h1>
            <p class="auth-subtitle">Enter your email and we'll send a reset link</p>
          </div>

          <div id="error-banner" style="display:none;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);border-radius:8px;padding:0.75rem 1rem;margin-bottom:1rem;font-size:0.85rem;color:#ef4444"></div>

          <form id="resetForm" novalidate>
            <div class="form-group">
              <label class="form-label">Email address</label>
              <div class="form-input-wrap">
                <svg class="form-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                <input type="email" id="email" placeholder="you@company.com" class="form-input" autocomplete="email" />
              </div>
              <div class="form-error" id="email-error"></div>
            </div>
            <button type="submit" class="btn-primary btn-full" id="sendBtn">Send reset link</button>
          </form>

          <p class="auth-switch" style="margin-top:1.25rem"><a href="login.html">← Back to sign in</a></p>
        </div>

        <!-- Step 2: Email sent confirmation -->
        <div id="step2" style="display:none;text-align:center">
          <div style="width:64px;height:64px;border-radius:50%;background:rgba(0,255,135,0.1);border:2px solid #00ff87;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#00ff87" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
          <h2 style="font-size:1.25rem;font-weight:700;color:var(--color-text-primary);margin-bottom:0.5rem">Check your inbox</h2>
          <p style="font-size:0.875rem;color:var(--color-text-muted);line-height:1.6;margin-bottom:1.5rem">
            We sent a password reset link to<br>
            <strong style="color:var(--color-text-primary)" id="sentToEmail">—</strong>
          </p>
          <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:1rem;margin-bottom:1.5rem;text-align:left">
            <div style="font-size:0.8rem;font-weight:600;color:var(--color-text-secondary);margin-bottom:0.625rem">Tips:</div>
            <div style="display:flex;flex-direction:column;gap:0.4rem">
              <div style="font-size:0.78rem;color:var(--color-text-muted);display:flex;align-items:center;gap:0.4rem">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#00ff87" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                Check your spam/junk folder
              </div>
              <div style="font-size:0.78rem;color:var(--color-text-muted);display:flex;align-items:center;gap:0.4rem">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#00ff87" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                The link expires in 60 minutes
              </div>
              <div style="font-size:0.78rem;color:var(--color-text-muted);display:flex;align-items:center;gap:0.4rem">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#00ff87" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                Use it only once
              </div>
            </div>
          </div>
          <button class="btn-ghost btn-full" id="resendBtn" style="margin-bottom:0.75rem">Resend email</button>
          <a href="login.html" style="font-size:0.85rem;color:var(--color-text-muted);text-decoration:none;display:block">← Back to sign in</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/particles.js"></script>
  <script>
    let sentEmail = '';
    let resendCooldown = false;

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('error-banner').style.display = 'none';
      document.getElementById('email-error').textContent = '';

      const email = document.getElementById('email').value.trim();
      const btn   = document.getElementById('sendBtn');

      if (!email || !email.includes('@')) {
        document.getElementById('email-error').textContent = 'Please enter a valid email address';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:0.5rem"><span class="btn-spinner"></span>Sending…</span>';

      const { error } = await window.sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/reset-password.html'
      });

      btn.disabled = false;
      btn.textContent = 'Send reset link';

      if (error) {
        const b = document.getElementById('error-banner');
        b.textContent = error.message;
        b.style.display = 'block';
        return;
      }

      sentEmail = email;
      document.getElementById('sentToEmail').textContent = email;
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
    });

    document.getElementById('resendBtn').addEventListener('click', async function () {
      if (resendCooldown) return;
      resendCooldown = true;
      this.disabled = true;

      await window.sb.auth.resetPasswordForEmail(sentEmail, {
        redirectTo: window.location.origin + '/reset-password.html'
      });

      let secs = 60;
      const orig = 'Resend email';
      const iv = setInterval(() => {
        secs--;
        this.textContent = `Resend in ${secs}s`;
        if (secs <= 0) {
          clearInterval(iv);
          this.textContent = orig;
          this.disabled = false;
          resendCooldown = false;
        }
      }, 1000);
    });
  </script>
</body>
</html>
